name: CI

# Gatilhos: todo pull request (feedback antes do merge), push na main (garante a branch principal),
# execução agendada em dias úteis (pega regressões sem mudança de código) e disparo manual.
# O quality gate separa regressão (reprova) de defeito conhecido [BUG-xxx] (aviso); o agendamento e o disparo
# manual com "strict" também reprovam por defeito conhecido, para não esquecer os que continuam abertos.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1-5' # 03:00 em Brasília
  workflow_dispatch:
    inputs:
      strict:
        description: 'Reprovar também por defeitos conhecidos em aberto'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: desafio_qa_ci
      JWT_SECRET: ci-only-secret
      SUPERADMIN_PASSWORD: Admin@123
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Gerar bundle do front
        run: npm run build:web

      - name: Recriar os dados iniciais
        run: npm run seed

      - name: Subir a aplicação
        run: |
          npm start > app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Aplicação no ar"
              curl -s http://localhost:3000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "Aplicação não subiu a tempo"; cat app.log; exit 1

      - name: Cache do binário do Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar o binário do Cypress
        run: npx cypress install

      # continue-on-error garante que os dois conjuntos rodem e que o relatório seja sempre publicado;
      # quem decide o resultado do job é o quality gate (último passo).
      - name: Testes de API
        id: api
        continue-on-error: true
        run: npm run test:api

      - name: Testes E2E (UI)
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Quality gate (regressão x defeito conhecido)
        id: gate
        if: always()
        continue-on-error: true
        env:
          STRICT: ${{ github.event_name == 'schedule' || github.event.inputs.strict == 'true' }}
        run: node scripts/quality-gate.js

      - name: Anexar log da aplicação
        if: always()
        run: cp app.log reports/app.log 2>/dev/null || true

      - name: Publicar relatórios e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            reports/api
            reports/e2e
            reports/app.log
          if-no-files-found: warn
          retention-days: 30

      - name: Falhar o job se o quality gate reprovou
        if: steps.gate.outcome == 'failure'
        run: |
          echo "Quality gate reprovado: veja o resumo da execução e o relatório publicado como artefato."
          exit 1
